    <style>
        /* التنسيق العام */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
    
        body {
            font-family: 'Tahoma', sans-serif;
            background-color: #f8f8f8;
            color: #333;
            margin: 0;
            padding: 0;
        }
    
        /* هيدر */
        .header {
            background: url('path_to_islamic_pattern.jpg') no-repeat center center/cover;
            padding: 40px 20px;
            text-align: center;
            position: relative;
            z-index: 1;
            background-color: rgba(0, 0, 0, 0.5);
        }
    
        .header h1 {
            color: #FFD700;
            font-size: 36px;
            font-family: 'Amiri', serif;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 15px;
        }
    
        /* قائمة التنقل */
        .navbar ul {
            list-style-type: none;
            padding: 0;
            text-align: center;
            margin: 0;
        }
    
        .navbar ul li {
            display: inline-block;
            margin: 0 10px;
        }
    
        .navbar ul li a {
            font-family: 'Amiri', serif;
            color: white;
            text-decoration: none;
            font-size: 18px;
            font-weight: bold;
            text-transform: uppercase;
            position: relative;
            padding: 12px 20px;
            background-color: rgba(0, 0, 0, 0.4);
            border-radius: 8px;
            transition: all 0.3s ease;
        }
    
        .navbar ul li a:hover {
            background-color: rgba(255, 255, 255, 0.2);
            color: #FFD700;
        }
    
        .navbar ul li a:after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background-color: #FFD700;
            transform: scaleX(0);
            transform-origin: bottom right;
            transition: transform 0.25s ease-out;
        }
    
        .navbar ul li a:hover:after {
            transform: scaleX(1);
            transform-origin: bottom left;
        }
    
        /* استجابة للموبايل */
        @media (max-width: 767px) {
            /* الهيدر */
            .header h1 {
                font-size: 28px;
                margin-bottom: 10px;
            }
    
            /* قائمة التنقل على الهواتف */
            .navbar ul li {
                display: block; /* جعل الأزرار تظهر عمودية */
                margin: 15px 0; /* زيادة المسافة بين الأزرار */
            }
    
            .navbar ul li a {
                padding: 12px 20px;
                font-size: 16px;
                width: 100%; /* جعل الأزرار تأخذ عرض الصفحة بالكامل */
                box-sizing: border-box;
            }
    
            .header {
                padding: 20px 20px; /* تقليل الحواف */
            }
    
            section {
                padding: 30px 15px;
                margin: 15px 0;
            }
    
            section h2 {
                font-size: 24px;
                margin-bottom: 15px;
            }
    
            section p {
                font-size: 14px;
                line-height: 1.6;
            }
    
            button, .download-button {
                width: 100%;
                padding: 15px;
                font-size: 14px;
                margin-top: 10px;
                box-sizing: border-box;
            }
        }
    
        /* استجابة للأجهزة الكبيرة */
        @media (min-width: 1200px) {
            .header h1 {
                font-size: 50px; /* تكبير حجم النص على الشاشات الكبيرة */
                margin-bottom: 20px;
            }
    
            .navbar ul li {
                margin: 0 20px;
            }
    
            .navbar ul li a {
                font-size: 20px;
            }
    
            section {
                display: flex;
                justify-content: space-around;
                padding: 60px 30px;
            }
    
            section h2 {
                font-size: 36px;
            }
    
            section p {
                font-size: 18px;
                max-width: 600px;
            }
        }
    </style>
